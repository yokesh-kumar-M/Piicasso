# ─── PIIcasso Platform — Development Stack ───────────────────────────────────
# Runs all PIIcasso services for local development.
#
# Service URLs:
#   Backend (Django)  → http://localhost:8000
#   Frontend (React)  → http://localhost:3000
#   Redis             → localhost:6379
#
# ─────────────────────────────────────────────────────────────────────────────

name: piicasso-platform-dev

services:
  # ─── 1. Django Backend ───────────────────────────────────────────────────────
  core-engine:
    build:
      context: ./Piicasso/backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./Piicasso/backend:/app
    ports:
      - "8000:8000"
    init: true
    environment:
      - ENV=development
      - DEBUG=True
      - DATABASE_URL=
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - ALLOWED_HOSTS=localhost,core-engine,127.0.0.1
    env_file:
      - ./Piicasso/backend/.env
    networks:
      - piicasso_net
    depends_on:
      redis:
        condition: service_healthy

  # ─── 2. React Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Piicasso/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./Piicasso/frontend/src:/app/src
      - ./Piicasso/frontend/public:/app/public
    ports:
      - "3000:3000"
    init: true
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/
      - CHOKIDAR_USEPOLLING=true
    networks:
      - piicasso_net

  # ─── 3. Celery Worker ────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./Piicasso/backend
      dockerfile: Dockerfile.dev
    command: ["celery", "-A", "backend", "worker", "-l", "info"]
    init: true
    volumes:
      - ./Piicasso/backend:/app
    environment:
      - ENV=development
      - DEBUG=True
      - DATABASE_URL=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./Piicasso/backend/.env
    networks:
      - piicasso_net
    depends_on:
      redis:
        condition: service_healthy

  # ─── 4. Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - piicasso_net

networks:
  piicasso_net:
    driver: bridge

volumes:
  redis_data:
