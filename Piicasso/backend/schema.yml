openapi: 3.0.3
info:
  title: PIIcasso — Threat Intelligence API
  version: 2.0.0
  description: Enterprise-grade API for AI-powered wordlist generation, team collaboration,
    threat intelligence, and breach monitoring.
paths:
  /api/admin/purge-all/:
    post:
      operationId: admin_purge_all_create
      description: |-
        Superuser-only destructive endpoint that wipes every piece of operational
        data: generation history, activity logs, system logs, notifications,
        messages, and all non-admin users. Requires an explicit confirmation
        token in the request body to prevent accidental triggering.
      summary: Purge all operational data
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPurgeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPurgeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminPurgeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPurgeResponse'
          description: ''
    delete:
      operationId: admin_purge_all_destroy
      description: |-
        Superuser-only destructive endpoint that wipes every piece of operational
        data: generation history, activity logs, system logs, notifications,
        messages, and all non-admin users. Requires an explicit confirmation
        token in the request body to prevent accidental triggering.
      summary: Purge all operational data
      tags:
      - Admin
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPurgeResponse'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      description: 'Superuser-only: list all users for admin to select and message.'
      summary: List standard users available for messaging
      tags:
      - Admin
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserList'
          description: ''
  /api/analytics/beacon/:
    post:
      operationId: analytics_beacon_create
      description: |-
        Authenticated presence heartbeat with optional, explicitly shared location.

        Coordinates are rounded server-side to a coarse grid before storage, even
        when a custom client submits higher precision. User-provided city names are
        intentionally discarded to avoid retaining more location data than needed.
      summary: Publish an authenticated location beacon
      tags:
      - Analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpBeaconRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HelpBeaconRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HelpBeaconRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpBeaconResponse'
          description: ''
  /api/analytics/globe-data/:
    get:
      operationId: analytics_globe_data_retrieve
      description: |-
        Returns geo-located user activity data for the interactive globe.
        Requires authentication — previously leaked all user login locations
        (lat/lng/city/username) to anonymous visitors.
      summary: List live globe activity
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobeDataResponse'
          description: ''
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      summary: Request a password recovery code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/auth/password/reset/verify/:
    post:
      operationId: auth_password_reset_verify_create
      summary: Reset a password with a recovery code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/cached/{cache_key}/:
    get:
      operationId: cached_retrieve
      description: Retrieves a recently generated wordlist from Redis via cache_key.
      summary: Retrieve a cached scored wordlist
      parameters:
      - in: path
        name: cache_key
        schema:
          type: string
        required: true
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CachedWordlistResponse'
          description: ''
  /api/download-token/:
    post:
      operationId: download_token_create
      description: |-
        Generate a short-lived, signed download token for browser window.open() downloads.
        This replaces passing full JWT access tokens in URL query parameters, which
        would leak them in server access logs, browser history, and Referer headers.
      summary: Create a short-lived download token
      tags:
      - Intelligence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DownloadTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DownloadTokenRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadTokenResponse'
          description: ''
  /api/download/{id}/:
    get:
      operationId: download_retrieve
      summary: Download a generated wordlist
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
                format: binary
          description: ''
  /api/export/csv/:
    get:
      operationId: export_csv_retrieve
      summary: Export generation history as CSV
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/file/{file_type}/{id}/:
    get:
      operationId: file_retrieve
      description: |-
        Download endpoint that accepts a short-lived signed token (not a full JWT).
        Token is generated by generate_download_token and expires in 60 seconds.
      summary: Download a file with a short-lived token
      parameters:
      - in: path
        name: file_type
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: token
        schema:
          type: string
        description: Signed token returned by the download-token endpoint.
        required: true
      tags:
      - Intelligence
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Production health check — verifies both the application layer and
        database connectivity. Used by load balancers and monitoring.
      summary: Check application and database health
      tags:
      - Health
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/history/:
    get:
      operationId: history_retrieve
      summary: List generation history
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: One-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items per page (maximum 100).
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
          description: ''
  /api/history/{id}/:
    delete:
      operationId: history_destroy
      summary: Delete a generation history entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/messages/:
    get:
      operationId: messages_list
      description: |-
        Superuser: GET ?user_id= → thread; GET → user list with unread counts;
                   POST {recipient_id, content} → send.
        Regular user: GET → admin conversation; POST {content} → reply to admin.
      summary: List administration conversations or a message thread
      parameters:
      - in: query
        name: user_id
        schema:
          type: integer
      tags:
      - Admin
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminConversationEntry'
          description: ''
    post:
      operationId: messages_create
      description: |-
        Superuser: GET ?user_id= → thread; GET → user list with unread counts;
                   POST {recipient_id, content} → send.
        Regular user: GET → admin conversation; POST {content} → reply to admin.
      summary: Send a message through the administration channel
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMessageRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminMessageRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminMessageRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConversationEntry'
          description: ''
  /api/operations/breach-search/:
    post:
      operationId: operations_breach_search_create
      description: |-
        Search for data breaches using the Have I Been Pwned API
        and internal generation history.

        NOTE (5.5): The /api/v3/breachedaccount/ endpoint requires a paid HIBP API key.
        Set the HIBP_API_KEY environment variable to enable email breach lookups.
        Without it, only the free password hash endpoint (k-anonymity) works.
      summary: Search breach intelligence for an account or password
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreachSearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BreachSearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BreachSearchRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreachSearchResponse'
          description: ''
  /api/operations/financial-risk/:
    get:
      operationId: operations_financial_risk_retrieve
      description: |-
        Continuous Threat Exposure Management snapshot.

        Computes a coarse monetary-impact estimate from the signals already
        present in the database: the user's password analyses, their generation
        history, and any breach exposures detected during scans. The numbers
        are conservative reference values modelled on published GDPR / CCPA
        settlement ranges — they are not a substitute for professional
        actuarial advice.
      summary: Calculate the current user's financial risk exposure
      tags:
      - Operations
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRiskResponse'
          description: ''
  /api/operations/messages/:
    get:
      operationId: operations_messages_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - operations
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: operations_messages_create
      tags:
      - operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/operations/messages/{id}/:
    get:
      operationId: operations_messages_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this message.
        required: true
      tags:
      - operations
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/operations/messages/{id}/mark_read/:
    post:
      operationId: operations_messages_mark_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this message.
        required: true
      tags:
      - operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/operations/notifications/:
    get:
      operationId: operations_notifications_retrieve
      description: Get notifications for the current user, mark as read, mark all
        as read.
      summary: List the current user's notifications
      tags:
      - Operations
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
          description: ''
    post:
      operationId: operations_notifications_create
      description: Mark notification(s) as read.
      summary: Mark one or all notifications as read
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationActionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationActionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationActionRequestRequest'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    delete:
      operationId: operations_notifications_destroy
      description: Clear all notifications for the user.
      summary: Clear all notifications
      tags:
      - Operations
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/operations/settings/:
    get:
      operationId: operations_settings_list
      description: Get all system settings.
      summary: List system settings
      tags:
      - Operations
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemSetting'
          description: ''
    post:
      operationId: operations_settings_create
      description: Update a system setting.
      summary: Create or update a system setting
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SystemSettingUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SystemSettingUpdateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingUpdateResponse'
          description: ''
    delete:
      operationId: operations_settings_destroy
      description: Delete a system setting.
      summary: Delete a system setting
      tags:
      - Operations
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/password/activity/:
    get:
      operationId: password_activity_retrieve
      summary: List recent password security activity
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActivityFeedResponse'
          description: ''
  /api/password/analyze/:
    post:
      operationId: password_analyze_create
      summary: Analyze password strength and breach exposure
      tags:
      - Intelligence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordAnalyzeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordAnalyzeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordAnalyzeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordAnalyzeResponse'
          description: ''
  /api/password/breach-check/:
    post:
      operationId: password_breach_check_create
      summary: Check a password against breach data
      tags:
      - Intelligence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordBreachCheckRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordBreachCheckRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordBreachCheckRequestRequest'
        required: true
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordBreachCheckResponse'
          description: ''
  /api/password/history/:
    get:
      operationId: password_history_retrieve
      summary: List recent password analyses
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordAnalysisHistoryResponse'
          description: ''
  /api/password/preferences/:
    get:
      operationId: password_preferences_retrieve
      summary: Get password security preferences
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
          description: ''
    put:
      operationId: password_preferences_update
      summary: Update password security preferences
      tags:
      - Intelligence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdateRequestRequest'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesUpdateResponse'
          description: ''
  /api/profile/:
    get:
      operationId: profile_retrieve
      description: Returns or updates detailed profile information for the authenticated
        user.
      summary: Get the authenticated user's profile
      tags:
      - Auth
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
    put:
      operationId: profile_update
      description: Returns or updates detailed profile information for the authenticated
        user.
      summary: Update the authenticated user's profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequestRequest'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    patch:
      operationId: profile_partial_update
      description: Returns or updates detailed profile information for the authenticated
        user.
      summary: Update the authenticated user's profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequestRequest'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/report/pdf/{id}/:
    get:
      operationId: report_pdf_retrieve
      summary: Download a generation report as PDF
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/stats/:
    get:
      operationId: stats_retrieve
      summary: Get generation statistics
      tags:
      - Intelligence
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
          description: ''
  /api/submit/:
    post:
      operationId: submit_create
      summary: Generate a scored targeted wordlist
      tags:
      - Intelligence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PiiserializerRequest'
          multipart/form-data:
