openapi: 3.0.3
info:
  title: PIIcasso — Threat Intelligence API
  version: 2.0.0
  description: Enterprise-grade API for AI-powered wordlist generation, team collaboration,
    threat intelligence, and breach monitoring.
paths:
  /api/admin/purge-all/:
    post:
      operationId: api_admin_purge_all_create
      description: |-
        Superuser-only destructive endpoint that wipes every piece of operational
        data: generation history, activity logs, system logs, notifications,
        messages, and all non-admin users. Requires an explicit confirmation
        token in the request body to prevent accidental triggering.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_admin_purge_all_destroy
      description: |-
        Superuser-only destructive endpoint that wipes every piece of operational
        data: generation history, activity logs, system logs, notifications,
        messages, and all non-admin users. Requires an explicit confirmation
        token in the request body to prevent accidental triggering.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/admin/users/:
    get:
      operationId: api_admin_users_retrieve
      description: 'Superuser-only: list all users for admin to select and message.'
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/analytics/beacon/:
    post:
      operationId: api_analytics_beacon_create
      description: |-
        The iconic HELP beacon — the frontend sends 'HELP' every 10 seconds
        with the user's geolocation (latitude/longitude).
        Creates a UserActivity LOGIN record so the globe can show user locations.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/analytics/globe-data/:
    get:
      operationId: api_analytics_globe_data_retrieve
      description: |-
        Returns geo-located user activity data for the interactive globe.
        Requires authentication — previously leaked all user login locations
        (lat/lng/city/username) to anonymous visitors.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/auth/password/reset/:
    post:
      operationId: api_auth_password_reset_create
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/password/reset/verify/:
    post:
      operationId: api_auth_password_reset_verify_create
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/cached/{cache_key}/:
    get:
      operationId: api_cached_retrieve
      description: Retrieves a recently generated wordlist from Redis via cache_key.
      parameters:
      - in: path
        name: cache_key
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/download-token/:
    post:
      operationId: api_download_token_create
      description: |-
        Generate a short-lived, signed download token for browser window.open() downloads.
        This replaces passing full JWT access tokens in URL query parameters, which
        would leak them in server access logs, browser history, and Referer headers.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/download/{id}/:
    get:
      operationId: api_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/export/csv/:
    get:
      operationId: api_export_csv_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/file/{file_type}/{id}/:
    get:
      operationId: api_file_retrieve
      description: |-
        Download endpoint that accepts a short-lived signed token (not a full JWT).
        Token is generated by generate_download_token and expires in 60 seconds.
      parameters:
      - in: path
        name: file_type
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: |-
        Production health check — verifies both the application layer and
        database connectivity. Used by load balancers and monitoring.
      tags:
      - api
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/history/:
    get:
      operationId: api_history_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/history/{id}/:
    delete:
      operationId: api_history_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/messages/:
    get:
      operationId: api_messages_retrieve
      description: |-
        Superuser: GET ?user_id= → thread; GET → user list with unread counts;
                   POST {recipient_id, content} → send.
        Regular user: GET → admin conversation; POST {content} → reply to admin.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_messages_create
      description: |-
        Superuser: GET ?user_id= → thread; GET → user list with unread counts;
                   POST {recipient_id, content} → send.
        Regular user: GET → admin conversation; POST {content} → reply to admin.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/operations/breach-search/:
    post:
      operationId: api_operations_breach_search_create
      description: |-
        Search for data breaches using the Have I Been Pwned API
        and internal generation history.

        NOTE (5.5): The /api/v3/breachedaccount/ endpoint requires a paid HIBP API key.
        Set the HIBP_API_KEY environment variable to enable email breach lookups.
        Without it, only the free password hash endpoint (k-anonymity) works.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/operations/financial-risk/:
    get:
      operationId: api_operations_financial_risk_retrieve
      description: |-
        Continuous Threat Exposure Management snapshot.

        Computes a coarse monetary-impact estimate from the signals already
        present in the database: the user's password analyses, their generation
        history, and any breach exposures detected during scans. The numbers
        are conservative reference values modelled on published GDPR / CCPA
        settlement ranges — they are not a substitute for professional
        actuarial advice.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/operations/messages/:
    get:
      operationId: api_operations_messages_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: api_operations_messages_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/operations/messages/{id}/:
    get:
      operationId: api_operations_messages_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/operations/messages/{id}/mark_read/:
    post:
      operationId: api_operations_messages_mark_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/operations/notifications/:
    get:
      operationId: api_operations_notifications_retrieve
      description: Get notifications for the current user, mark as read, mark all
        as read.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_operations_notifications_create
      description: Mark notification(s) as read.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_operations_notifications_destroy
      description: Clear all notifications for the user.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/operations/settings/:
    get:
      operationId: api_operations_settings_retrieve
      description: Get all system settings.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_operations_settings_create
      description: Update a system setting.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_operations_settings_destroy
      description: Delete a system setting.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/password/activity/:
    get:
      operationId: api_password_activity_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/password/analyze/:
    post:
      operationId: api_password_analyze_create
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/password/breach-check/:
    post:
      operationId: api_password_breach_check_create
      tags:
      - api
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/password/history/:
    get:
      operationId: api_password_history_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/password/preferences/:
    get:
      operationId: api_password_preferences_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    put:
      operationId: api_password_preferences_update
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/profile/:
    get:
      operationId: api_profile_retrieve
      description: Returns or updates detailed profile information for the authenticated
        user.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    put:
      operationId: api_profile_update
      description: Returns or updates detailed profile information for the authenticated
        user.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: api_profile_partial_update
      description: Returns or updates detailed profile information for the authenticated
        user.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/report/pdf/{id}/:
    get:
      operationId: api_report_pdf_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/stats/:
    get:
      operationId: api_stats_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/submit/:
    post:
      operationId: api_submit_create
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/super-admin/:
    get:
      operationId: api_super_admin_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_super_admin_create
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_super_admin_destroy
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/system/logs/:
    get:
      operationId: api_system_logs_retrieve
      description: |-
        System logs — now requires authentication and superuser access (1.1 fix).
        Previously publicly readable by any anonymous visitor.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/teams/:
    get:
      operationId: api_teams_retrieve
      description: Retrieves intelligence feed and member details for the current
        team.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/teams/chat/:
    get:
      operationId: api_teams_chat_retrieve
      description: Secure team communication channel.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_teams_chat_create
      description: Secure team communication channel.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/teams/create/:
    post:
      operationId: api_teams_create_create
      description: Establishes a new tactical team and assigns the creator as LEADER.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/teams/join/:
    post:
      operationId: api_teams_join_create
      description: Joins an existing team using a verified invite code.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/teams/leave/:
    post:
      operationId: api_teams_leave_create
      description: Handles operator extraction from current unit or unit decommissioning.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/terminal/:
    post:
      operationId: api_terminal_create
      description: |-
        Simulated terminal for the cybersecurity-themed UI.
        All commands are whitelisted and return hardcoded output.
        No real system commands are ever executed.
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/user/auth/google/:
    post:
      operationId: api_user_auth_google_create
      description: |-
        Google OAuth login — verifies Google ID tokens using the google-auth library
        with proper audience (client ID) checking (1.4 fix).

        Previously used the deprecated tokeninfo debug endpoint which:
        - Did not verify the audience claim
        - Accepted tokens from ANY Google app
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/user/auth/password/reset/:
    post:
      operationId: api_user_auth_password_reset_create
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/user/auth/password/reset/verify/:
    post:
      operationId: api_user_auth_password_reset_verify_create
      tags:
      - api
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/user/ping/:
    get:
      operationId: api_user_ping_retrieve
      description: Health check endpoint to verify the server is awake.
      tags:
      - api
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/user/register/:
    post:
      operationId: api_user_register_create
      tags:
      - api
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /api/user/token/:
    post:
      operationId: api_user_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPairRequest'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          description: No response body
  /api/user/token/refresh/:
    post:
      operationId: api_user_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        recipient:
          type: integer
          nullable: true
        recipient_name:
          type: string
          readOnly: true
        content:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
      required:
      - content
      - id
      - is_read
      - recipient_name
      - sender
      - sender_name
      - timestamp
    MessageRequest:
      type: object
      properties:
        recipient:
          type: integer
          nullable: true
        content:
          type: string
          minLength: 1
      required:
      - content
    MyTokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PaginatedMessageList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Auth
  description: Authentication & registration
- name: Intelligence
  description: Wordlist generation & history
- name: Teams
  description: Team management & chat
- name: Operations
  description: System logs, messages, notifications
- name: Analytics
  description: Globe data & activity tracking
- name: Admin
  description: Super-admin operations
- name: Health
  description: System health & monitoring
