# Common dev commands for PIIcasso. Install: https://taskfile.dev
#
#   task setup        # first-time environment setup (backend venv + frontend deps + pre-commit)
#   task dev           # run backend + frontend dev servers together
#   task test           # run both test suites
#   task lint            # ruff check (backend) + eslint (frontend)
#   task format          # ruff format + prettier --write
#   task typecheck        # mypy on the seed-strict backend modules
#   task up / task down    # docker compose full stack

version: '3'

vars:
  BACKEND_DIR: Piicasso/backend
  FRONTEND_DIR: Piicasso/frontend
  NODE_CLI_DIR: Piicasso/cli-node
  PYTHON_CLI_DIR: Piicasso/cli-python
  COMPOSE_FILE: Piicasso/docker-compose.yml
  # Execute modules/scripts with backend/.venv without shell activation.
  BACKEND_TOOL: python scripts/run_backend_tool.py

tasks:
  setup:
    desc: First-time setup — backend venv, frontend deps, pre-commit hooks
    cmds:
      - python -m venv {{.BACKEND_DIR}}/.venv
      - '{{.BACKEND_TOOL}} pip install -r requirements-dev.txt'
      - '{{.BACKEND_TOOL}} pip install -e "../cli-python[dev]"'
      - npm ci --prefix {{.FRONTEND_DIR}}
      - npm ci --prefix {{.NODE_CLI_DIR}}
      - '{{.BACKEND_TOOL}} pre_commit install'
      - 'echo "Setup complete. Copy {{.BACKEND_DIR}}/.env.example to {{.BACKEND_DIR}}/.env and fill it in before running the servers."'

  dev:backend:
    desc: Run the Django dev server
    cmds:
      - '{{.BACKEND_TOOL}} manage.py runserver'

  dev:frontend:
    desc: Run the Vite dev server
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run dev

  dev:
    desc: Run backend + frontend dev servers together
    deps: [dev:backend, dev:frontend]

  test:backend:
    desc: Run the Django test suite
    cmds:
      - '{{.BACKEND_TOOL}} manage.py test --verbosity=2'

  test:frontend:
    desc: Run the frontend test suite
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm test

  test:cli-node:
    desc: Run the Node CLI contract suite
    dir: '{{.NODE_CLI_DIR}}'
    cmds:
      - npm test

  test:cli-python:
    desc: Run the Python CLI contract suite
    cmds:
      - '{{.BACKEND_TOOL}} pytest ../cli-python'

  test:
    desc: Run backend, frontend, and both CLI test suites
    cmds:
      - task: test:backend
      - task: test:frontend
      - task: test:cli-node
      - task: test:cli-python

  lint:backend:
    desc: Ruff check (backend)
    cmds:
      - '{{.BACKEND_TOOL}} ruff check .'

  lint:frontend:
    desc: ESLint (frontend)
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run lint

  lint:cli-python:
    desc: Ruff check for the Python CLI
    cmds:
      - '{{.BACKEND_TOOL}} ruff check --config ../cli-python/pyproject.toml ../cli-python'

  lint:
    desc: Lint backend, frontend, and Python CLI
    cmds:
      - task: lint:backend
      - task: lint:frontend
      - task: lint:cli-python

  format:backend:
    desc: Ruff format (backend)
    cmds:
      - '{{.BACKEND_TOOL}} ruff format .'

  format:frontend:
    desc: Prettier --write (frontend)
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - npm run format

  format:cli-python:
    desc: Ruff format the Python CLI
    cmds:
      - '{{.BACKEND_TOOL}} ruff format --config ../cli-python/pyproject.toml ../cli-python'

  format:
    desc: Format backend, frontend, and Python CLI
    cmds:
      - task: format:backend
      - task: format:frontend
      - task: format:cli-python

  typecheck:
    desc: mypy on the seed-strict backend modules (see pyproject.toml overrides)
    cmds:
      - '{{.BACKEND_TOOL}} mypy wordgen/utils.py wordgen/throttles.py wordgen/llm_handler.py generator/fields.py backend/settings.py'

  schema:
    desc: Regenerate the OpenAPI schema.yml (run after changing any API view/serializer).
    cmds:
      - '{{.BACKEND_TOOL}} manage.py spectacular --file schema.yml --validate --fail-on-warn'

  compose:validate:
    desc: Validate the development Compose model
    cmds:
      - docker compose -f docker-compose.yml config --quiet

  up:
    desc: Start the full stack via Docker Compose (requires backend/.env)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up --build

  down:
    desc: Stop the Docker Compose stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down
