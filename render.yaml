services:
  # ─── Pantheon Backend Services ───────────────────────────────────────────────
  - type: web
    name: pantheon
    env: docker
    plan: free
    region: singapore
    branch: main
    rootDir: pantheon
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health/
    dockerCommand: sh ./start.sh
    envVars:
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "False"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SENTRY_DSN
        sync: false # Set manually in Render dashboard
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: core-engine-woeg.onrender.com,pantheon-woeg.onrender.com,.onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://core-engine-woeg.onrender.com,https://pantheon-woeg.onrender.com,https://pii-casso.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false # Set manually in Render dashboard
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
